name: API CI

on:
  push:
    paths:
      - "apps/api/**"
      - "scripts/qwen_spike/**"
      - ".github/workflows/api-ci.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - "scripts/qwen_spike/**"
      - ".github/workflows/api-ci.yml"

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install
        run: python -m pip install -e "./apps/api[dev]"
      - name: Lint
        run: ruff check apps/api scripts/qwen_spike
      - name: Type check
        run: mypy apps/api/app
      - name: Tests
        run: pytest apps/api/tests -m "not live_qwen"
