services:
  api:
    build:
      context: ./apps/api
    ports:
      - "8000:8000"
    environment:
      APP_NAME: ${APP_NAME:-AdegaFlow AI API}
      APP_ENV: ${APP_ENV:-development}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/runtime/adegaflow.db}
      DEMO_SEED_PATH: ${DEMO_SEED_PATH:-/app/data/seeds/demo_seed.json}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      QWEN_BASE_URL: ${QWEN_BASE_URL:-https://dashscope-intl.aliyuncs.com/compatible-mode/v1}
      QWEN_MODEL: ${QWEN_MODEL:-qwen3.7-plus}
      QWEN_FALLBACK_MODEL: ${QWEN_FALLBACK_MODEL:-qwen3.6-flash}
      QWEN_TIMEOUT_SECONDS: ${QWEN_TIMEOUT_SECONDS:-30}
      QWEN_MAX_RETRIES: ${QWEN_MAX_RETRIES:-2}
      ASYNC_RUN_QUEUE_CAPACITY: ${ASYNC_RUN_QUEUE_CAPACITY:-10}
    volumes:
      - adegaflow-data:/app/runtime
      - ./data/seeds:/app/data/seeds:ro
    restart: unless-stopped

volumes:
  adegaflow-data:
